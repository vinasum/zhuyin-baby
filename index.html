<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寶寶貝學ㄅㄆㄇ</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:#fff8e7; font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color:#5a3e1b; }
  h1 { font-size:2rem; margin:0 0 1rem; }
  .row { display:flex; gap:16px; }
  button { font-size:3rem; width:96px; height:96px; border:none; border-radius:24px; background:#ffd36b;
           color:#5a3e1b; box-shadow:0 6px 0 #e0a92e; cursor:pointer; }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #e0a92e; }
  p { margin-top:1.5rem; font-size:1.1rem; }
</style>
</head>
<body>
  <h1>寶寶貝學ㄅㄆㄇ</h1>
  <div class="row">
    <button onclick="say('ㄅ')">ㄅ</button>
    <button onclick="say('ㄆ')">ㄆ</button>
    <button onclick="say('ㄇ')">ㄇ</button>
  </div>
  <p>網站上線成功！點點看注音符號～</p>
<script>
  function say(t){
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-TW'; u.rate = 0.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
</script>
</body>
</html>
